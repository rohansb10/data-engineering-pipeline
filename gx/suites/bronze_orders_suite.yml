name: bronze_orders_suite
expectations:

  # ── Schema checks ──────────────────────────────────────────────────────────
  - type: expect_column_to_exist
    kwargs: {column: order_id}
  - type: expect_column_to_exist
    kwargs: {column: customer_id}
  - type: expect_column_to_exist
    kwargs: {column: order_status}
  - type: expect_column_to_exist
    kwargs: {column: order_purchase_timestamp}
  - type: expect_column_to_exist
    kwargs: {column: order_delivered_customer_date}
  - type: expect_column_to_exist
    kwargs: {column: order_estimated_delivery_date}

  # ── Not null ───────────────────────────────────────────────────────────────
  - type: expect_column_values_to_not_be_null
    kwargs: {column: order_id}
  - type: expect_column_values_to_not_be_null
    kwargs: {column: customer_id}
  - type: expect_column_values_to_not_be_null
    kwargs: {column: order_status}

  # ── Uniqueness ─────────────────────────────────────────────────────────────
  - type: expect_column_values_to_be_unique
    kwargs: {column: order_id}

  # ── Domain / set checks ────────────────────────────────────────────────────
  - type: expect_column_values_to_be_in_set
    kwargs:
      column: order_status
      value_set: ["delivered", "shipped", "processing", "canceled",
                  "unavailable", "invoiced", "created", "approved"]

  # ── Row count sanity ───────────────────────────────────────────────────────
  - type: expect_table_row_count_to_be_between
    kwargs: {min_value: 1, max_value: 200000}
